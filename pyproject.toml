[project]
name = "tracewake"
version = "0.4.0"
description = "Record. Replay. Find the divergence. Deterministic execution recording, replay, and differential debugging for AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["pydantic>=2.11", "typer>=0.15"]

[project.scripts]
tracewake = "tracewake.cli:main"
tracewake-worker = "tracewake.worker:main"

[project.entry-points.pytest11]
tracewake = "tracewake.pytest_plugin"

[project.optional-dependencies]
embeddings = [
    "mlx-embeddings>=0.1.0",
]
# Only the hosted worker talks to a queue; local Tracewake never needs an AWS SDK.
aws = [
    "boto3>=1.35",
]

[dependency-groups]
corpus = [
    "mlx-embeddings>=0.1.0",
    "mlx-lm>=0.28",
]
# What `bench/` needs to read the trajectory sources. Not runtime dependencies:
# nothing in `tracewake/` imports either, and the published package installs
# without them. They live here so the evaluation commands the documentation
# cites actually run on a fresh checkout.
bench = [
    "pyarrow>=15",
    "datasets>=2.14",
]
dev = ["pytest>=8.4", "ruff>=0.16", "mypy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
# Linting only. `ruff format` disagrees with this codebase's dense,
# single-line style in most files; adopting it is a separate, much larger
# decision than adopting the linter, not something to fold in here.

[tool.ruff.lint.per-file-ignores]
# A worker daemon and a fault-injection harness, both of which must survive
# and log an unexpected failure rather than die from one. Each site already
# logs what it recovered from.
"tracewake/worker.py" = ["BLE001"]
# The evidence harness inspects `.returncode` itself for readiness polling and
# expected non-zero exits (a not-yet-ready Postgres, a fault-injection probe);
# `check=True` would turn an expected outcome into a raised exception. The
# `open()` file handles in stack.py are passed straight into `subprocess.Popen`
# and must outlive the function that opens them, for the life of the
# long-running process they back; a `with` block would close them immediately.
"evidence/scenarios.py" = ["BLE001", "PLW1510"]
"evidence/stack.py" = ["PLW1510", "SIM115"]
# JSON fixture strings built with `%` so their literal `{`/`}` never collide
# with f-string interpolation syntax.
"tests/test_agent.py" = ["UP031"]

[tool.ruff.lint]
# Implicit multi-line string concatenation inside a list/dict literal is this
# codebase's established way to keep a long message readable; used the same
# way a dozen times, mostly in bench/external.py. Nested `with` blocks are
# this codebase's established test style for stacking several context
# managers as separate, readable setup steps -- every current instance is
# in tests/.
ignore = ["ISC004", "SIM117"]

[tool.mypy]
# "normal application code" per AGENTS.md -- the shipped library and CLI, not
# tests, bench/, evidence/, or the corpus tooling, which lean on looser,
# dynamic patterns by convention (fixtures, mocks, ad-hoc dicts).
files = ["tracewake"]
python_version = "3.13"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Optional, lazily-imported dependencies (see the aws/embeddings extras and
# tracewake/worker.py's inline `import boto3`): never installed in the base
# dev environment, so mypy cannot see their stubs. Not a blanket ignore --
# every other missing import still fails loudly.
module = ["boto3", "huggingface_hub", "mlx_embeddings"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["tracewake"]

# Hatchling does not honour .gitignore or .git/info/exclude, so an allowlist is
# what keeps local working notes out of a published sdist. Denylisting them by
# name would leak the names and would not cover notes added later.
[tool.hatch.build.targets.sdist]
include = [
    "/tracewake",
    "/bench",
    "/contracts",
    "/contracttest",
    "/evidence",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
