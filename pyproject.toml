[project]
name = "locus"
version = "0.2.0"
description = "Find where two coding agent runs diverged."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["pydantic>=2.11", "typer>=0.15"]

[project.scripts]
locus = "locus.cli:main"
locus-worker = "locus.worker:main"

[project.entry-points.pytest11]
locus = "locus.pytest_plugin"

[project.optional-dependencies]
embeddings = [
    "mlx-embeddings>=0.1.0",
]
# Only the hosted worker talks to a queue; local Locus never needs an AWS SDK.
aws = [
    "boto3>=1.35",
]

[dependency-groups]
corpus = [
    "mlx-embeddings>=0.1.0",
    "mlx-lm>=0.28",
]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["locus"]

# Hatchling does not honour .gitignore or .git/info/exclude, so an allowlist is
# what keeps local working notes out of a published sdist. Denylisting them by
# name would leak the names and would not cover notes added later.
[tool.hatch.build.targets.sdist]
include = ["/locus", "/tests", "/contracts", "/contracttest", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
