[project]
name = "locus"
version = "0.1.0"
description = "Find where two coding agent runs diverged."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.11"]

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["locus"]

# Hatchling does not honour .gitignore or .git/info/exclude, so an allowlist is
# what keeps local working notes out of a published sdist. Denylisting them by
# name would leak the names and would not cover notes added later.
[tool.hatch.build.targets.sdist]
include = ["locus", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
