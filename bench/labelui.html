<meta charset="utf-8">
<title>locus — divergence labeling</title>
<style>
  :root {
    --bg: #14161c; --panel: #1b1e26; --panel-2: #232733; --line: #2c313d;
    --text: #d7dbe4; --dim: #8b93a4; --accent: #6aa9ff; --ok: #7ec27e;
    --err: #e08b7a; --pick: #f0c674;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 10px 16px;
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  h1 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin: 0; }
  .pid { font-weight: 700; font-size: 16px; }
  .bar { flex: 1; height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; min-width: 120px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .count { color: var(--dim); font-variant-numeric: tabular-nums; }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit;
  }
  button:hover:not(:disabled) { background: #2c3242; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: #10131a; border-color: var(--accent); font-weight: 600; }

  .def { padding: 10px 16px; color: var(--dim); font-size: 12.5px; border-bottom: 1px solid var(--line); background: var(--panel); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px 16px 120px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section h2 {
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim);
    margin: 0 0 8px; position: sticky; top: 52px; background: var(--bg); padding: 6px 0;
  }
  .step { border: 1px solid var(--line); border-radius: 7px; margin-bottom: 6px; background: var(--panel); }
  .step .top { display: flex; gap: 8px; align-items: baseline; padding: 7px 10px; }
  .num { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 22px; font-weight: 600; }
  .name { font-weight: 600; }
  .target { color: var(--accent); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .tag { margin-left: auto; font-size: 11px; color: var(--err); }
  .why { padding: 0 10px 8px 40px; color: var(--dim); font-size: 12.5px; white-space: pre-wrap; }
  .args { padding: 0 10px 8px 40px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: #9aa4b8; word-break: break-all; }

  #failure .step { cursor: pointer; }
  #failure .step:hover { border-color: var(--accent); background: var(--panel-2); }
  #failure .step.picked { border-color: var(--pick); background: #2a2a1e; box-shadow: inset 3px 0 0 var(--pick); }
  #failure .step.after { opacity: .45; }
  .hint { color: var(--dim); font-size: 12px; margin: 0 0 8px; }

  footer {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
    border-top: 1px solid var(--line); padding: 10px 16px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .picked-label { font-weight: 600; color: var(--pick); min-width: 130px; }
  input[type=text] {
    flex: 1; min-width: 160px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font: inherit;
  }
  .done { color: var(--ok); }
</style>

<header>
  <h1>Labeling</h1>
  <span class="pid" id="pid">—</span>
  <div class="bar"><div id="fill"></div></div>
  <span class="count" id="count"></span>
  <button id="prev">‹ Prev</button>
  <button id="next">Next ›</button>
</header>

<div class="def" id="def"></div>

<main>
  <section>
    <h2>Success — fixed the bug</h2>
    <p class="hint">Reference only. Note which file it edited.</p>
    <div id="success"></div>
  </section>
  <section>
    <h2>Failure — click the step</h2>
    <p class="hint">Last step at which this run still had a real chance.</p>
    <div id="failure"></div>
  </section>
</main>

<footer>
  <span class="picked-label" id="picked">nothing picked</span>
  <input type="text" id="note" placeholder="note to yourself (optional)">
  <button class="primary" id="save" disabled>Save &amp; next</button>
  <span id="status"></span>
</footer>

<script>
let S = null, labels = {}, notes = {}, idx = 0, picked = null;

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

function stepNode(s, clickable) {
  const d = el("div", "step");
  const top = el("div", "top");
  top.appendChild(el("span", "num", s.n + "."));
  top.appendChild(el("span", "name", s.name));
  if (s.target) top.appendChild(el("span", "target", "→ " + s.target));
  if (s.status !== "ok") top.appendChild(el("span", "tag", "error"));
  d.appendChild(top);
  if (s.reason) d.appendChild(el("div", "why", s.reason));
  if (s.args && s.args !== "{}") d.appendChild(el("div", "args", s.args));
  if (clickable) d.addEventListener("click", () => pick(s.n));
  return d;
}

function pick(n) {
  picked = n;
  document.querySelectorAll("#failure .step").forEach((node, i) => {
    node.classList.toggle("picked", i + 1 === n);
    node.classList.toggle("after", i + 1 > n);
  });
  document.getElementById("picked").textContent = "point of no return: step " + n;
  document.getElementById("save").disabled = false;
}

function render() {
  const p = S.packets[idx];
  document.getElementById("pid").textContent = p.id;
  document.getElementById("def").textContent = p.definition;
  const done = Object.values(labels).filter((v) => v !== null && v !== undefined).length;
  document.getElementById("count").textContent =
    `${idx + 1} of ${S.packets.length}  ·  ${done} labeled`;
  document.getElementById("fill").style.width = (done / S.packets.length * 100) + "%";

  const succ = document.getElementById("success");
  const fail = document.getElementById("failure");
  succ.replaceChildren(...p.success.map((s) => stepNode(s, false)));
  fail.replaceChildren(...p.failure.map((s) => stepNode(s, true)));

  picked = null;
  document.getElementById("picked").textContent = "nothing picked";
  document.getElementById("save").disabled = true;
  document.getElementById("note").value = notes[p.id] || "";
  document.getElementById("status").textContent = "";
  if (labels[p.id] !== null && labels[p.id] !== undefined) {
    pick(labels[p.id]);
    document.getElementById("status").className = "done";
    document.getElementById("status").textContent = "already labeled";
  }
  document.getElementById("prev").disabled = idx === 0;
  document.getElementById("next").disabled = idx === S.packets.length - 1;
  window.scrollTo(0, 0);
}

async function save() {
  const p = S.packets[idx];
  const note = document.getElementById("note").value;
  const res = await fetch("/api/label", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ packet_id: p.id, label: picked, note }),
  });
  if (!res.ok) {
    document.getElementById("status").textContent = "save failed";
    return;
  }
  labels[p.id] = picked;
  notes[p.id] = note;
  if (idx < S.packets.length - 1) { idx++; render(); }
  else { render(); document.getElementById("status").textContent = "that was the last one"; }
}

document.getElementById("save").addEventListener("click", save);
document.getElementById("prev").addEventListener("click", () => { if (idx > 0) { idx--; render(); } });
document.getElementById("next").addEventListener("click", () => {
  if (idx < S.packets.length - 1) { idx++; render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") { if (e.key === "Enter" && picked !== null) save(); return; }
  if (e.key === "Enter" && picked !== null) save();
  else if (e.key === "ArrowLeft" && idx > 0) { idx--; render(); }
  else if (e.key === "ArrowRight" && idx < S.packets.length - 1) { idx++; render(); }
});

fetch("/api/state").then((r) => r.json()).then((data) => {
  S = data;
  for (const row of data.rows) { labels[row.packet_id] = row.label; notes[row.packet_id] = row.note || ""; }
  const first = S.packets.findIndex((p) => labels[p.id] === null || labels[p.id] === undefined);
  idx = first === -1 ? 0 : first;
  render();
});
</script>
