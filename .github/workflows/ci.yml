name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.13
      - run: PYTHONHASHSEED=0 uv run --python 3.13 pytest

  package:
    name: Build and installed-wheel smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv build
      - name: Check artifact contents
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          artifacts = [*Path("dist").glob("*.tar.gz"), *Path("dist").glob("*.whl")]
          assert len(artifacts) == 2, artifacts
          for artifact in artifacts:
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      names = archive.namelist()
                  roots = {Path(name).parts[0] for name in names}
                  assert "tracewake" in roots
                  assert all(
                      root == "tracewake"
                      or (root.startswith("tracewake-") and root.endswith(".dist-info"))
                      for root in roots
                  ), (artifact, roots)
              else:
                  with tarfile.open(artifact) as archive:
                      names = archive.getnames()
                  roots = {
                      Path(name).parts[1]
                      for name in names
                      if len(Path(name).parts) > 1
                  }
                  allowed = {
                      ".gitignore",
                      "LICENSE",
                      "PKG-INFO",
                      "README.md",
                      "contracts",
                      "contracttest",
                      "pyproject.toml",
                      "tests",
                      "tracewake",
                  }
                  assert roots <= allowed, (artifact, roots - allowed)
          PY
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/tracewake-wheel"
          "$RUNNER_TEMP/tracewake-wheel/bin/python" -m pip install dist/*.whl
      - name: Run installed-package smoke example
        run: |
          smoke="$RUNNER_TEMP/tracewake-smoke"
          mkdir "$smoke"
          recorded=$("$RUNNER_TEMP/tracewake-wheel/bin/tracewake" record \
            --store "$smoke/store" --name smoke -- \
            "$RUNNER_TEMP/tracewake-wheel/bin/python" -c \
            'import tracewake; s = tracewake.current(); print(s.clock.time()); s.outcome(status="ok")')
          replayed=$("$RUNNER_TEMP/tracewake-wheel/bin/tracewake" replay smoke --store "$smoke/store")
          test "$(printf '%s\n' "$recorded" | head -n 1)" = \
            "$(printf '%s\n' "$replayed" | head -n 1)"

  contracts:
    name: Contract compatibility / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: contracttest/go/go.mod
          cache: false
      - run: uv sync --locked --python 3.13
      - run: uv run --python 3.13 python -m tracewake.contracts --output contracts/schemas/v1 --check
      - run: uv run --python 3.13 python -m contracttest.generate_fixtures --output contracttest/fixtures/v1 --check
      - run: go test ./...
        working-directory: contracttest/go
      - run: go test -race ./...
        working-directory: contracttest/go
      - run: go test -fuzz=FuzzContractValidatorsDoNotPanic -fuzztime=3s
        working-directory: contracttest/go

  control-plane:
    name: Go control plane and PostgreSQL lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      TRACEWAKE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: controlplane/go.mod
          cache-dependency-path: controlplane/go.sum
      - run: go test ./...
        working-directory: controlplane
      - run: go test -race ./...
        working-directory: controlplane
      - run: go test -run=^$ -fuzz=FuzzNormalizedDigest -fuzztime=3s ./internal/controlplane
        working-directory: controlplane
      - run: go vet ./...
        working-directory: controlplane
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...
        working-directory: controlplane

  evidence:
    name: Operational evidence harness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: controlplane/go.mod
          cache-dependency-path: controlplane/go.sum
      - name: Put the PostgreSQL server binaries on PATH
        run: ls -d /usr/lib/postgresql/*/bin | tee -a "$GITHUB_PATH"
      - run: uv sync --locked --python 3.13
      # Shortened: this proves the harness still drives the real services. The
      # published numbers come from a full run retained in evidence/results.
      - run: uv run --python 3.13 python -m evidence --quick --output "$RUNNER_TEMP/evidence"

  dashboard:
    name: TypeScript dashboard and browser security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.node-version
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm audit
        working-directory: dashboard
      - run: npm test
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard
      - run: npm run test:e2e
        working-directory: dashboard
      - run: docker build -f controlplane/Dockerfile -t tracewake-control-plane:test .
      - run: docker build -f Dockerfile.worker -t tracewake-worker:test .

  terraform:
    name: Terraform configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
        working-directory: deploy/aws
      - run: terraform init -backend=false
        working-directory: deploy/aws
      - run: terraform validate
        working-directory: deploy/aws
      - run: terraform test
        working-directory: deploy/aws
