name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.13
      - run: PYTHONHASHSEED=0 uv run --python 3.13 pytest

  package:
    name: Build and installed-wheel smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv build
      - name: Check artifact contents
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          artifacts = [*Path("dist").glob("*.tar.gz"), *Path("dist").glob("*.whl")]
          assert len(artifacts) == 2, artifacts
          for artifact in artifacts:
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      names = archive.namelist()
                  roots = {Path(name).parts[0] for name in names}
                  assert "locus" in roots
                  assert all(
                      root == "locus"
                      or (root.startswith("locus-") and root.endswith(".dist-info"))
                      for root in roots
                  ), (artifact, roots)
              else:
                  with tarfile.open(artifact) as archive:
                      names = archive.getnames()
                  roots = {
                      Path(name).parts[1]
                      for name in names
                      if len(Path(name).parts) > 1
                  }
                  allowed = {
                      ".gitignore",
                      "LICENSE",
                      "PKG-INFO",
                      "README.md",
                      "contracts",
                      "contracttest",
                      "locus",
                      "pyproject.toml",
                      "tests",
                  }
                  assert roots <= allowed, (artifact, roots - allowed)
          PY
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/locus-wheel"
          "$RUNNER_TEMP/locus-wheel/bin/python" -m pip install dist/*.whl
      - name: Run installed-package smoke example
        run: |
          smoke="$RUNNER_TEMP/locus-smoke"
          mkdir "$smoke"
          recorded=$("$RUNNER_TEMP/locus-wheel/bin/locus" record \
            --store "$smoke/store" --name smoke -- \
            "$RUNNER_TEMP/locus-wheel/bin/python" -c \
            'import locus; s = locus.current(); print(s.clock.time()); s.outcome(status="ok")')
          replayed=$("$RUNNER_TEMP/locus-wheel/bin/locus" replay smoke --store "$smoke/store")
          test "$(printf '%s\n' "$recorded" | head -n 1)" = \
            "$(printf '%s\n' "$replayed" | head -n 1)"

  contracts:
    name: Contract compatibility / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: contracttest/go/go.mod
          cache: false
      - run: uv sync --locked --python 3.13
      - run: uv run --python 3.13 python -m locus.contracts --output contracts/schemas/v1 --check
      - run: uv run --python 3.13 python -m contracttest.generate_fixtures --output contracttest/fixtures/v1 --check
      - run: go test ./...
        working-directory: contracttest/go
      - run: go test -race ./...
        working-directory: contracttest/go
      - run: go test -fuzz=FuzzContractValidatorsDoNotPanic -fuzztime=3s
        working-directory: contracttest/go
