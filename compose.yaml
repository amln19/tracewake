services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tracewake
      POSTGRES_USER: tracewake
      POSTGRES_PASSWORD: tracewake-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracewake"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  controlplane:
    build:
      context: .
      dockerfile: controlplane/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRACEWAKE_DATABASE_URL: postgres://tracewake:tracewake-local-only@postgres/tracewake?sslmode=disable
      TRACEWAKE_TOKEN_PEPPER: local-tenant-pepper-change-me-000000
      TRACEWAKE_WORKER_PEPPER: local-worker-pepper-change-me-000000
      TRACEWAKE_ARTIFACT_ROOT: /var/lib/tracewake/artifacts
      TRACEWAKE_LISTEN_ADDR: 0.0.0.0:8080
      TRACEWAKE_WORKER_LISTEN_ADDR: 0.0.0.0:8081
      # Object grants are handed to clients, so they must name the address the
      # client uses: the published port for tenants, the service name for the
      # worker container.
      TRACEWAKE_PUBLIC_BASE_URL: http://127.0.0.1:8080
      TRACEWAKE_WORKER_BASE_URL: http://controlplane:8081
      TRACEWAKE_BOOTSTRAP_FILE: /run/tracewake/credentials.json
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - artifacts:/var/lib/tracewake/artifacts
      - credentials:/run/tracewake

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      - controlplane
    environment:
      TRACEWAKE_WORKER_URL: http://controlplane:8081
      TRACEWAKE_WORKER_CREDENTIALS_FILE: /run/tracewake/credentials.json
      TRACEWAKE_WORKER_BUILD: local-compose
    volumes:
      - credentials:/run/tracewake:ro

volumes:
  artifacts:
  credentials:
  postgres-data:
